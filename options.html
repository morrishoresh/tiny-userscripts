<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiny Userscripts</title>
<style>
  body { font: 14px system-ui, sans-serif; color: #1f2330; max-width: 860px; margin: 24px auto; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 40px; height: 40px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  #banner { background: #fff4e5; border: 1px solid #f2c48a; border-radius: 6px; padding: 10px 12px; margin-top: 18px; }
  #banner button { margin-left: 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 12px; border: 1px solid #dde0ea; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  li .main { flex: 1; min-width: 0; }
  li .name { font-weight: 600; }
  li .version { font-weight: 400; color: #6b7080; margin-left: 6px; }
  li .desc, li .matches { color: #6b7080; font-size: 12px; overflow-wrap: anywhere; }
  li .matches { font-family: ui-monospace, Menlo, Consolas, monospace; }
  li .matches .more { font: 12px system-ui, sans-serif; background: none; border: none; padding: 0; margin-left: 4px; color: #2b5fd9; cursor: pointer; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #eceef4; white-space: nowrap; }
  .status.ok { background: #e3f6e8; color: #1d6b34; }
  .status.bad { background: #fde8e8; color: #9b1c1c; }
  textarea { width: 100%; box-sizing: border-box; height: 320px; font: 12px ui-monospace, Menlo, Consolas, monospace; padding: 8px; border: 1px solid #c9cdd9; border-radius: 6px; }
  textarea[readonly] { background: #f6f7fa; }
  .buttons { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .buttons button { flex-shrink: 0; }
  #message { min-width: 0; white-space: pre-line; }
  #message.bad { color: #9b1c1c; }
  #empty { color: #6b7080; }
</style>
</head>
<body>
<header>
  <img src="icons/icon96.png" alt="">
  <h1>Tiny Userscripts</h1>
</header>

<div id="banner" hidden></div>

<h2>Installed</h2>
<p id="empty">No userscripts installed.</p>
<ul id="scripts"></ul>

<h2 id="editorTitle">Install a userscript</h2>
<textarea id="code" spellcheck="false" placeholder="// ==UserScript==
// @name        My script
// @match       https://example.com/*
// ==/UserScript==

console.log('hello');"></textarea>
<div class="buttons">
  <button id="save">Install</button>
  <button id="import">Import files…</button>
  <button id="cancel" hidden>Cancel</button>
  <input type="file" id="file" accept=".js" multiple hidden>
  <span id="message"></span>
</div>

<script src="meta.js"></script>
<script src="options.js"></script>
</body>
</html>
